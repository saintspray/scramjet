<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>The Last Train Never Came</title>
<!--
  ============================================================================
  THE LAST TRAIN NEVER CAME  —  a walkable pixel-art narrative game
  ----------------------------------------------------------------------------
  You play as KALI. Walk through a ruined night train carriage, step up to
  objects and to Emy, and talk. Now and then you slip into a cold "flash" of
  Emy's unspoken thoughts. Three choices + a kiss lead to one of five endings.

  Single self-contained HTML file. Canvas pixel rendering, no frameworks.
  Controls:  ← →  or  A D  to walk.   ↑ / E / Space  to interact / continue.
  Touch:     on-screen arrows + action button.

  All writing lives in the DATA section at the top of <script>. Edit freely.
  ============================================================================
-->
<style>
  :root{
    --amber:#d9a55b; --amber-dim:#9c7740; --moss-soft:#6f8466; --moss:#4a5d44;
    --paper:#e7e2d4; --gray:#8d918d; --gray-dim:#5a5f5a; --blue:#9cc0e8;
    --glass:rgba(10,15,16,0.88); --font:"Georgia","Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:#000;color:var(--paper);font-family:var(--font);
    overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;
    -webkit-tap-highlight-color:transparent;touch-action:none;}
  #stage{position:absolute;inset:0;overflow:hidden;background:#05070a;}

  /* The pixel canvas — scaled up crisply, centered, letterboxed. */
  #game{position:absolute;inset:0;margin:auto;display:block;background:#05070a;}

  /* ---------------- HUD ---------------- */
  #hud{position:absolute;inset:0;z-index:20;pointer-events:none;}
  #hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);
    color:var(--moss-soft);font-size:13px;letter-spacing:1px;font-style:italic;
    text-align:center;max-width:80%;text-shadow:0 1px 4px #000;transition:opacity .4s;}
  #loc{position:absolute;top:12px;left:14px;color:var(--gray);font-size:11px;
    letter-spacing:2px;text-transform:uppercase;text-shadow:0 1px 3px #000;}
  #music-toggle{position:absolute;top:8px;right:10px;pointer-events:auto;
    background:var(--glass);color:var(--gray);border:1px solid var(--gray-dim);
    border-radius:3px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:var(--font);}
  #music-toggle:hover{color:var(--amber);border-color:var(--amber-dim);}
  #bond{position:absolute;top:34px;left:14px;display:flex;gap:5px;}
  #bond .pip{width:7px;height:7px;border-radius:50%;background:var(--gray-dim);transition:all .4s;}
  #bond .pip.on{background:var(--amber);box-shadow:0 0 7px rgba(217,165,91,.6);}
  /* Inventory bar */
  #inv{position:absolute;top:48px;left:14px;display:flex;gap:6px;pointer-events:auto;}
  #inv .slot{width:34px;height:34px;border:1px solid rgba(111,132,102,.4);border-radius:4px;
    background:rgba(10,15,16,0.7);display:flex;align-items:center;justify-content:center;
    font-size:18px;cursor:pointer;transition:all .15s;}
  #inv .slot:hover{border-color:var(--amber);background:rgba(217,165,91,.12);transform:translateY(-2px);}
  #inv .slot.new{animation:slotpop .5s ease;}
  @keyframes slotpop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1)}}
  /* Pickup toast */
  #toast{position:absolute;top:14px;left:50%;transform:translateX(-50%) translateY(-10px);
    background:rgba(10,15,16,.9);border:1px solid var(--amber-dim);border-radius:3px;
    color:var(--amber);padding:7px 14px;font-size:13px;letter-spacing:1px;opacity:0;
    transition:all .3s;pointer-events:none;}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---------------- Touch controls ---------------- */
  #touch{position:absolute;inset:0;z-index:22;pointer-events:none;opacity:0;transition:opacity .3s;}
  #touch.show{opacity:1;}
  .tbtn{position:absolute;bottom:18px;width:64px;height:64px;border-radius:50%;
    background:rgba(20,28,28,0.55);border:1px solid rgba(111,132,102,.5);
    color:var(--paper);font-size:26px;display:flex;align-items:center;justify-content:center;
    pointer-events:auto;}
  .tbtn:active{background:rgba(217,165,91,.3);}
  #t-left{left:18px;} #t-right{left:92px;} #t-act{right:18px;width:74px;height:74px;font-size:18px;letter-spacing:1px;}

  /* ---------------- Dialogue ---------------- */
  #dialogue{position:absolute;left:0;right:0;bottom:0;z-index:30;pointer-events:auto;
    padding:50px 16px 18px;background:linear-gradient(180deg,transparent,var(--glass) 28%);
    transition:opacity .3s,transform .3s;}
  #dialogue.hidden{opacity:0;pointer-events:none;transform:translateY(20px);}
  #dialogue-inner{max-width:720px;margin:0 auto;background:var(--glass);
    border:1px solid rgba(111,132,102,.35);border-radius:4px;padding:16px 20px 18px;
    box-shadow:0 -4px 26px rgba(0,0,0,.6);position:relative;}
  #dialogue-inner.pop{animation:settle .3s ease;}
  @keyframes settle{0%{transform:translateY(4px)}100%{transform:translateY(0)}}
  #speaker{position:absolute;top:-13px;left:16px;background:#141a16;
    border:1px solid rgba(111,132,102,.4);padding:3px 12px;border-radius:2px;
    font-size:13px;letter-spacing:2px;}
  #speaker.emy{color:var(--moss-soft);border-color:var(--moss);}
  #speaker.kali{color:var(--amber);border-color:var(--amber-dim);}
  #speaker.narr{color:var(--gray);border-color:var(--gray-dim);font-style:italic;}
  #speaker.flash{color:var(--blue);border-color:#4a6c94;background:#101822;font-style:italic;}
  #line{min-height:58px;margin-top:6px;font-size:clamp(15px,2.4vw,17px);line-height:1.65;}
  #line .narr-line{color:var(--gray);font-style:italic;}
  #line .flash-line{color:#b6d2ee;font-style:italic;text-shadow:0 0 12px rgba(120,165,215,.4);}
  #choices{display:flex;flex-direction:column;gap:7px;margin-top:12px;}
  .choice{pointer-events:auto;cursor:pointer;text-align:left;background:rgba(74,93,68,.10);
    color:var(--paper);border:1px solid rgba(111,132,102,.3);border-radius:3px;
    padding:10px 13px;font-family:var(--font);font-size:clamp(14px,2.2vw,15px);line-height:1.4;
    transition:all .15s;}
  .choice:hover,.choice:focus-visible{background:rgba(217,165,91,.12);border-color:var(--amber);
    color:var(--amber);outline:none;transform:translateX(3px);}
  #continue{position:absolute;right:14px;bottom:10px;color:var(--amber-dim);font-size:12px;
    animation:bob 1.6s ease-in-out infinite;}
  #continue.gone{display:none;}
  @keyframes bob{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(3px);opacity:1}}

  /* ---------------- Screens ---------------- */
  .screen{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:30px;transition:opacity .8s;}
  .hidden{opacity:0;pointer-events:none;} .gone{display:none!important;}
  #title-screen{background:radial-gradient(120% 95% at 50% 30%,rgba(20,32,26,.5),rgba(6,9,9,.9) 85%);}
  #title-screen>*{animation:riseIn 1.1s ease both;}
  #title-screen h1{font-size:clamp(26px,6vw,50px);font-weight:normal;letter-spacing:3px;
    max-width:14ch;line-height:1.2;text-shadow:0 0 24px rgba(217,165,91,.25);animation-delay:.2s;}
  #title-screen .sub{margin-top:12px;color:var(--amber-dim);letter-spacing:4px;font-size:13px;
    text-transform:uppercase;animation-delay:.7s;}
  #title-screen .dedication{margin-top:24px;color:var(--gray);font-style:italic;font-size:14px;
    max-width:30ch;line-height:1.6;animation-delay:1.2s;}
  @keyframes riseIn{from{opacity:0;transform:translateY(16px);filter:blur(4px)}
    to{opacity:1;transform:translateY(0);filter:blur(0)}}
  .btn{margin-top:30px;cursor:pointer;background:transparent;color:var(--paper);
    border:1px solid var(--moss-soft);border-radius:2px;padding:12px 26px;font-family:var(--font);
    font-size:15px;letter-spacing:2px;transition:all .25s;animation-delay:1.8s;}
  .btn:hover{background:rgba(111,132,102,.15);border-color:var(--amber);color:var(--amber);}
  #ending-screen{background:radial-gradient(120% 90% at 50% 40%,#13201a,#050706 85%);}
  #ending-screen h2{font-size:clamp(22px,5vw,36px);font-weight:normal;letter-spacing:2px;
    color:var(--amber);margin-bottom:18px;}
  #ending-screen .ending-text{max-width:46ch;line-height:1.9;font-style:italic;
    font-size:clamp(15px,2.3vw,17px);}
  #ending-screen .ending-text span{display:inline;opacity:0;animation:fadeUp 1.6s ease forwards;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  #ending-screen .ending-tag{margin-top:22px;color:var(--gray);letter-spacing:3px;
    text-transform:uppercase;font-size:12px;}
  #fader{position:absolute;inset:0;z-index:50;background:#000;opacity:0;pointer-events:none;
    transition:opacity .7s;}
  #fader.show{opacity:1;}

  @media(max-width:560px){#hint{font-size:11px;max-width:70%}#dialogue{padding:42px 10px 14px}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="960" height="420"></canvas>

  <div id="hud">
    <div id="loc">Carriage 3 — after midnight</div>
    <div id="hint"></div>
    <button id="music-toggle">♪ music: off</button>
    <div id="bond"><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div><div class="pip"></div></div>
    <div id="inv"></div>
    <div id="toast"></div>
  </div>

  <div id="touch">
    <div class="tbtn" id="t-left">◄</div>
    <div class="tbtn" id="t-right">►</div>
    <div class="tbtn" id="t-act">E</div>
  </div>

  <div id="dialogue" class="hidden">
    <div id="dialogue-inner">
      <div id="speaker" class="narr">—</div>
      <div id="line"></div>
      <div id="choices"></div>
      <div id="continue">tap / E ▸</div>
    </div>
  </div>

  <div id="title-screen" class="screen">
    <h1>The Last Train Never Came</h1>
    <div class="sub">a quiet night, a long way from anywhere</div>
    <p class="dedication">For someone who makes the dark feel survivable.<br>
      Move with the arrows. Step close to things, and to her.</p>
    <button class="btn" id="start-btn">Step aboard</button>
  </div>

  <div id="ending-screen" class="screen gone">
    <h2 id="ending-title"></h2>
    <p class="ending-text" id="ending-body"></p>
    <p class="ending-tag" id="ending-tag"></p>
    <button class="btn" id="replay-btn">Again, from the start</button>
  </div>

  <div id="fader"></div>
</div>

<script>
/* ===========================================================================
   1–4. STORY DATA  (edit text here; speakers: emy / kali / narr / flash)
   =========================================================================== */
const OPENING = [
  { who: "narr",  text: "The platform clock died at 11:54. I keep checking it anyway. Hope's a stubborn little muscle; mine never learned to quit." },
  { who: "narr",  text: "Rain on a roof that's mostly gone now. Moss in the seams of the tiles. And her — Emy — a few steps down the carriage, the way she always keeps. Close enough to protect. Far enough to bolt." },
  { who: "kali",  text: "Well. The schedule says the last train left a long time before either of us was born." },
  { who: "emy",   text: "Then why'd you read the schedule." },
  { who: "kali",  text: "Hope's a hard habit." },
  { who: "emy",   text: "Yeah. Heard it kills people." },
  { who: "flash", text: "I shouldn't've said that. She reads dead schedules for the same dumb reason I read exit signs. I just can't make it come out soft." },
  { who: "narr",  text: "There it is again. That half-second where I swear I can feel the inside of her — like the wall's got a hairline crack and the light leaks through before she patches it." },
  { who: "kali",  text: "We're stuck here till the light. Might as well get to know the place." },
  { who: "emy",   text: "...Fine. But I'm not singing campfire songs." },
  { who: "narr",  text: "(Walk the carriage. Step up to things and press LOOK. Talk to her when you're ready. And every so often I'll catch a flash of her — the parts she keeps behind her teeth.)" },
];

const OBJECTS = [
  { id:"bench", name:"a cracked bench", bond:0, lines:[
      { who: "narr",  text: "A bench grown soft with rot. Someone carved two sets of initials into it once, then scratched one out. I run my thumb over the scar of it." },
      { who: "emy",   text: "People used to wait here. Real polite about it. Lined up. Trusted the thing would come." },
      { who: "kali",  text: "You say 'trusted' like it's a disease." },
      { who: "emy",   text: "Isn't it? You trust a train. Train stops coming. Now you're just a person standing in the cold, holding a ticket." },
      { who: "kali",  text: "Or you're a person who got to believe in something, right up until you didn't. That's not nothing." },
      { who: "emy",   text: "..." },
      { who: "flash", text: "She still believes in things. I can see her doing it — right now, believing in me. It's the scariest thing I've ever had to stand next to and not flinch away from." },
      { who: "emy",   text: "Sit down before you fall down. You've been on that foot all day." },
  ]},
  { id:"poster", name:"a faded travel poster", bond:1, lines:[
      { who: "narr", text: "A peeling poster. A coastline that probably doesn't exist anymore. 'THE SEA IS CLOSER THAN YOU THINK.'" },
      { who: "kali", text: "I've never seen it. The sea. Have you?" },
      { who: "emy",  text: "Once. From far. It was gray and it was loud and it didn't care about us at all." },
      { who: "kali", text: "That sounds kind of perfect." },
      { who: "emy",  text: "...It kind of was." },
      { who: "kali", text: "Take me sometime. When the roads are quieter." },
      { who: "emy",  text: "The roads are never gonna be quieter, Kali." },
      { who: "kali", text: "Then take me when they're loud. I don't mind, if it's with you." },
      { who: "narr", text: "She looks at the poster very hard, so she doesn't have to look at me." },
      { who: "flash", text: "Take you to the sea. Like I get to make plans. Like wanting something out loud doesn't just hand the world a list of what to take from me. ...I'd carry you the whole way, though. I'd never say it. But I would." },
  ]},
  { id:"radio", name:"a dead radio", bond:1, lines:[
      { who: "narr", text: "A handheld radio, half its case gone. I thumb the wheel out of habit. Static, then almost-music, then static." },
      { who: "kali", text: "Wait— go back. There. You hear that?" },
      { who: "emy",  text: "It's noise." },
      { who: "kali", text: "It's a song. Somebody, somewhere, is still playing a song. That means somebody's still out there." },
      { who: "emy",  text: "Or it's a tape on a loop in an empty room, playing for no one." },
      { who: "kali", text: "God, you're exhausting." },
      { who: "emy",  text: "I'm careful. There's a difference." },
      { who: "kali", text: "Is there? From in here it looks like the same coat." },
      { who: "narr", text: "She turns the volume down to almost-nothing and lets the almost-music stay. A small mercy. For who, neither of us says." },
      { who: "flash", text: "It's a tape on a loop in an empty room. I know that. I turned it down so it'd keep playing anyway — because she smiled at it for one second. That's the whole truth I keep behind the careful." },
  ]},
  { id:"pack", name:"Kali's pack", bond:1, lines:[
      { who: "narr", text: "My pack, slumped against a seat. The zipper's broken; I've tied it shut with a bootlace." },
      { who: "emy",  text: "You carry too much. You'll wreck your back hauling other people's junk." },
      { who: "kali", text: "It's not junk. Look— this is from the kid in the river town. This, the old man traded me for stitches." },
      { who: "emy",  text: "So you carry strangers around with you." },
      { who: "kali", text: "I carry proof. That I met them. That they were real and they were kind and the world had them in it for a while." },
      { who: "emy",  text: "And when the pack gets too heavy?" },
      { who: "kali", text: "Then I guess I find someone to share the weight." },
      { who: "narr", text: "She's not looking at the pack when I say it. She's looking at me." },
      { who: "flash", text: "Share the weight. Her name was right there in my mouth. I swallowed it, like always. Names are just one more thing the world knows to come back for." },
  ]},
  { id:"mirror", name:"a shard of mirror", bond:1, lines:[
      { who: "narr", text: "A long shard of mirror wedged in a window frame. I can see half my face in it. We both can." },
      { who: "kali", text: "There. That's us. The whole population of the world, far as we know." },
      { who: "emy",  text: "Population's down. One of us looks like hell." },
      { who: "kali", text: "You look tired, Emy. Not the same thing." },
      { who: "emy",  text: "What's the difference." },
      { who: "kali", text: "Tired means you've still got somewhere to get to. People who give up stop looking tired. They look... finished. You're not finished." },
      { who: "emy",  text: "How do you know." },
      { who: "kali", text: "Because you keep checking that I'm still behind you. Every twenty steps. All day." },
      { who: "emy",  text: "...I do not." },
      { who: "kali", text: "You did it twice while we've been standing here." },
      { who: "flash", text: "Three times. She missed one. I check because the day she's not behind me is the day I forget how to keep walking. I'd rather not learn what that's like." },
  ]},
  { id:"door", name:"the carriage door", choice:"door", bond:0, lines:[
      { who: "narr", text: "The end door, swollen in its frame. Half-open. Cold air pours through it like water. I could force it shut. I could leave it." },
  ]},
  { id:"fire", name:"a rusted barrel", choice:"fire", bond:0, act:1, lines:[
      { who: "narr", text: "An old burn barrel somebody dragged aboard. There's enough dry scrap for one small fire. Maybe enough warmth for one of us to actually sleep." },
  ]},
  /* ----- ACT TWO objects (revealed when the night deepens) ----- */
  { id:"ledger", name:"the conductor's ledger", bond:1, act:2, lines:[
      { who: "narr",  text: "A ledger swollen fat with damp, left on the conductor's stand. Columns of names. Destinations. Every line is someone who rode where we're standing and believed they were going somewhere." },
      { who: "kali",  text: "Look how many. All these people. All these somewheres." },
      { who: "emy",   text: "All gone now. Names in a wet book nobody'll ever read." },
      { who: "kali",  text: "We're reading it." },
      { who: "emy",   text: "...Yeah. I guess we are." },
      { who: "flash", text: "She does that. Finds the one thread of not-pointless in a thing and pulls until it holds my weight too. I walked in here sure the world was just a graveyard. She keeps quietly turning it back into a place where people lived." },
      { who: "narr",  text: "She writes two names, small, in the margin where the paper's still dry. They'll be gone by morning. She writes them anyway." },
      { who: "emy",   text: "...Leave a little room. In case we come back." },
  ]},
  { id:"shoe", name:"a child's shoe", bond:1, act:2, lines:[
      { who: "narr",  text: "A child's shoe on its side under a seat. Small. The laces still tied in a careful double knot somebody must have learned the slow way." },
      { who: "emy",   text: "..." },
      { who: "kali",  text: "Hey. You okay?" },
      { who: "emy",   text: "Fine. It's just a shoe." },
      { who: "flash", text: "It is not just a shoe. It's a person who got tied into their laces by somebody who loved them, on a morning that ended like all the mornings ended. I don't have words for that don't crack open, so I hand her 'fine.'" },
      { who: "kali",  text: "We don't have to look at it." },
      { who: "emy",   text: "No. Somebody should. Somebody should look at the small things and not flinch. It's the only funeral most of them ever got." },
      { who: "narr",  text: "She sets the shoe upright, careful, the way you'd straighten something on a grave. Something in my chest goes tight and bright and dangerous, and I have to look away first." },
  ]},
  { id:"skylight", name:"a hole in the roof", bond:1, act:2, lines:[
      { who: "narr",  text: "A jagged hole torn in the carriage roof. Through it, impossibly, stars — more than the dead cities ever let us see. The dark up there doesn't know a thing ended down here." },
      { who: "kali",  text: "There's the one thing the world couldn't ruin. Too far away to get the news." },
      { who: "emy",   text: "Make a wish, then. Isn't that the deal." },
      { who: "kali",  text: "You first." },
      { who: "emy",   text: "I don't wish. Wishing's just disappointment with extra steps." },
      { who: "flash", text: "I wished. Of course I wished. I wished for exactly what's standing next to me to still be standing next to me when the light comes up. I'd never say it out loud. Saying it out loud is how the world learns what to take." },
      { who: "kali",  text: "Okay. Then I'll wish loud enough for the both of us." },
      { who: "emy",   text: "...Don't waste it on me." },
      { who: "kali",  text: "Too late. Already did." },
  ]},
  { id:"knife", name:"Emy's folding knife", bond:1, act:2, lines:[
      { who: "narr",  text: "She's got an old folding knife she keeps touching when she thinks I'm not looking. Bone handle, worn pale where her thumb sits. The one thing she carries that isn't strictly for surviving." },
      { who: "kali",  text: "Can I?" },
      { who: "emy",   text: "...Careful. It's sharp." },
      { who: "narr",  text: "She sets it in my hand. From Emy, this is practically handing me her diary." },
      { who: "kali",  text: "Whose was it?" },
      { who: "emy",   text: "Someone's. Before. They taught me how to hold it so I'd never have to need anybody to keep me safe." },
      { who: "flash", text: "And it worked. I never needed anybody. That was the whole point, and the whole prison. Then she walks in and I catch myself wanting to need her, and the knife hasn't got one useful thing to say about that." },
      { who: "kali",  text: "They'd be glad it kept you safe." },
      { who: "emy",   text: "Yeah. Funny thing is — lately I keep forgetting to reach for it." },
      { who: "kali",  text: "Yeah? Why's that." },
      { who: "emy",   text: "...You know why. Don't make me say it." },
  ]},
  { id:"flask", name:"a dented flask", bond:1, act:2, lines:[
      { who: "narr",  text: "A dented steel flask in an overhead locker, somehow still sealed. She sniffs it, makes a face, takes a swig anyway, and hands it over. Some firewater that outlived the end of everything." },
      { who: "kali",  text: "God, that's awful." },
      { who: "emy",   text: "Best awful thing for miles." },
      { who: "kali",  text: "(coughs) To the last train. May it stay good and gone." },
      { who: "emy",   text: "To the last train." },
      { who: "flash", text: "She's loose now, warm, laughing at the burn of it, and I could watch her laugh until the world starts itself over. I'm in so much trouble. The good kind. The kind I'd forgotten was even on the menu." },
      { who: "emy",   text: "...You're easier to be around than anybody's got a right to be, you know that?" },
      { who: "kali",  text: "That a compliment?" },
      { who: "emy",   text: "It's the closest I've got. Take it before I take it back." },
  ]},
];

ctx.imageSmoothingEnabled = true;

function fitCanvas(){
  const ww = window.innerWidth, wh = window.innerHeight;
  let cw = ww, ch = ww * H / W;
  if (ch > wh) { ch = wh; cw = wh * W / H; }
  canvas.style.width = Math.round(cw) + "px";
  canvas.style.height = Math.round(ch) + "px";
}
window.addEventListener("resize", fitCanvas);
fitCanvas();

/* ---- painterly grain texture, built once ---- */
const grain = document.createElement("canvas"); grain.width = 150; grain.height = 150;
(function(){ const g = grain.getContext("2d"); const im = g.createImageData(150,150);
  for(let i=0;i<im.data.length;i+=4){ const v = 180 + (Math.random()*70|0);
    im.data[i]=v; im.data[i+1]=v; im.data[i+2]=v; im.data[i+3] = Math.random()*22|0; }
  g.putImageData(im,0,0); })();

/* small helpers */
function srand(seed){ let s=seed%2147483647; if(s<=0)s+=2147483646;
  return ()=>{ s=s*16807%2147483647; return (s-1)/2147483646; }; }
function rr(x,y,w,h,r,col){ x=Math.round(x);y=Math.round(y);
  ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); ctx.fill(); }
function shade(hex, amt){ const n=parseInt(hex.slice(1),16);
  let r=Math.max(0,Math.min(255,(n>>16)+amt)), g=Math.max(0,Math.min(255,((n>>8)&255)+amt)),
      b=Math.max(0,Math.min(255,(n&255)+amt)); return "rgb("+r+","+g+","+b+")"; }

/* ---- carriage props (drawn in screen space; pass worldX - cam) ---- */
function drawScreen(sx, seed){ const x=Math.round(sx); if(x<-150||x>W+20) return;
  const y=108, w=132, h=78;
  ctx.fillStyle="#0b0d10"; ctx.fillRect(x-5,y-5,w+10,h+10);          // black frame
  const rg=ctx.createLinearGradient(0,y,0,y+h);
  rg.addColorStop(0,"#7c2533"); rg.addColorStop(1,"#36141d");
  ctx.fillStyle=rg; ctx.fillRect(x,y,w,h);                          // red base
  const rnd=srand(seed);
  for(let i=0;i<34;i++){ const bx=x+rnd()*w, by=y+rnd()*h, bw=4+rnd()*20, bh=2+rnd()*7;
    ctx.fillStyle="rgba("+(150+(rnd()*80|0))+","+(38+(rnd()*34|0))+","+(46+(rnd()*22|0))+","+(0.22+rnd()*0.4)+")";
    ctx.fillRect(bx,by,bw,bh); }                                    // lava veins
  ctx.fillStyle="rgba(160,44,48,0.10)"; ctx.fillRect(x-12,y-12,w+24,h+34); // glow
  ctx.fillStyle="#23303c"; for(let i=0;i<5;i++) ctx.fillRect(x+14,y+h+10+i*5,w-28,2); // vent
}

  ctx.beginPath(); ctx.arc(x+31,y+16,4,0,7); ctx.fill();
  ctx.fillStyle="#3c4651"; for(let i=0;i<4;i++) ctx.fillRect(x+10,y+30+i*6,w-20,2);
  ctx.fillStyle="#2f3842"; for(let i=0;i<5;i++) ctx.fillRect(x+10,y+62+i*5,w-20,2); // vent
}

}
function drawLamp(sx){ const x=Math.round(sx); if(x<-50||x>W+30) return;
  const fl=0.82+0.18*Math.sin(tick*0.12 + x);
  ctx.fillStyle="#1b2430"; ctx.fillRect(x-16,WALL_TOP+12,32,5);
  const grd=ctx.createRadialGradient(x,FLOOR_Y,4,x,FLOOR_Y,90);
  grd.addColorStop(0,"rgba(217,165,91,"+(0.12*fl)+")"); grd.addColorStop(1,"rgba(217,165,91,0)");
  ctx.fillStyle=grd; ctx.fillRect(x-90,FLOOR_Y-70,180,110);
  const cg=ctx.createLinearGradient(0,WALL_TOP+16,0,FLOOR_Y);
  cg.addColorStop(0,"rgba(217,165,91,"+(0.06*fl)+")"); cg.addColorStop(1,"rgba(217,165,91,0)");
  ctx.fillStyle=cg; ctx.beginPath(); ctx.moveTo(x-6,WALL_TOP+16); ctx.lineTo(x+6,WALL_TOP+16);
  ctx.lineTo(x+44,FLOOR_Y); ctx.lineTo(x-44,FLOOR_Y); ctx.closePath(); ctx.fill();
}

// A clean "[E] Look" prompt floating above the thing you're near (no orbs).
function promptAt(sx, sy, text){
  let x=Math.round(sx), y=Math.round(sy)-20;
  if (x<-60||x>W+60) return;
  const float = Math.sin(tick*0.1)*1.5;  y+=float;
  ctx.font="12px Georgia, serif"; ctx.textAlign="left";
  const tw=ctx.measureText(text).width, padL=22, w=padL+tw+10, bx=x-w/2;
  rr(bx, y-14, w, 19, 4, "rgba(8,12,12,0.88)");
  rr(bx+5, y-11, 13, 13, 2, "#e7cd96");          // keycap
  ctx.fillStyle="#0e140d"; ctx.font="bold 9px Georgia, serif"; ctx.fillText("E", bx+9, y-1);
  ctx.fillStyle="#e7cd96"; ctx.font="12px Georgia, serif"; ctx.fillText(text, bx+padL, y);
  ctx.textAlign="left";
}

/* ---- chibi character (big head, little body), painterly ---- */
function drawChar(sx, c, dir, walking, lit, cold){
  const x=Math.round(sx);
  const bob = walking ? Math.abs(Math.sin(tick*0.22))*3 : Math.sin(tick*0.04)*0.8;
  const y=Math.round(FLOOR - bob);
  ctx.fillStyle="rgba(0,0,0,0.32)"; ctx.beginPath(); ctx.ellipse(x,FLOOR+4,14,4,0,0,7); ctx.fill();
  const skin=cold?"#aabfd2":c.skin, coat=cold?shade(c.coat,26):c.coat, hair=cold?shade(c.hair,22):c.hair;
  const step=walking?Math.sin(tick*0.22):0;
  // legs
  ctx.fillStyle="#2a2630";
  ctx.fillRect(x-7, y-12+(step>0?2:0), 6, 12); ctx.fillRect(x+1, y-12+(step<0?2:0), 6, 12);
  // body / coat
  rr(x-12, y-34, 24, 24, 8, coat);
  rr(x-12, y-34, 24, 7, 8, shade(coat,16));
  rr(x-15, y-32, 6, 17, 3, shade(coat,-12)); rr(x+9, y-32, 6, 17, 3, shade(coat,-12)); // arms
  // head
  rr(x-13, y-60, 26, 28, 12, skin);
  // hair
  rr(x-14, y-62, 28, 16, 12, hair);
  if(c.longHair){ rr(x-14,y-54,7,24,4,hair); rr(x+7,y-54,7,24,4,hair); }   // Emy long
  else { rr(x-14,y-52,6,13,3,hair); rr(x+8,y-52,6,13,3,hair); }            // Kali short
  // blush
  ctx.fillStyle="rgba(205,120,110,0.22)"; ctx.fillRect(x-10,y-42,5,3); ctx.fillRect(x+5,y-42,5,3);
  // eyes
  ctx.fillStyle="#241a14"; const eo=dir>0?1:-1;
  ctx.fillRect(x-7+eo, y-47, 3, 4); ctx.fillRect(x+4+eo, y-47, 3, 4);
  // glasses (Kali)
  if(c.glasses){ ctx.strokeStyle=c.glasses; ctx.lineWidth=1.4;
    ctx.strokeRect(x-9, y-49, 8, 8); ctx.strokeRect(x+1, y-49, 8, 8);
    ctx.beginPath(); ctx.moveTo(x-1,y-45); ctx.lineTo(x+1,y-45); ctx.stroke(); }
  if(lit){ const gg=ctx.createRadialGradient(x,y-26,4,x,y-26,40);
    gg.addColorStop(0,"rgba(217,165,91,0.18)"); gg.addColorStop(1,"rgba(217,165,91,0)");
    ctx.fillStyle=gg; ctx.fillRect(x-40,y-64,80,72); }
  if(cold){ const gg=ctx.createRadialGradient(x,y-26,4,x,y-26,42);
    gg.addColorStop(0,"rgba(120,165,215,0.22)"); gg.addColorStop(1,"rgba(120,165,215,0)");
    ctx.fillStyle=gg; ctx.fillRect(x-42,y-66,84,76); }
}

const KALI = { skin:"#e3bd98", coat:"#4a4250", hair:"#15151c", glasses:"#dfeaf5" };
const EMY  = { skin:"#d8ab80", coat:"#46523f", hair:"#5d4129", longHair:true };

/* ---- the main render ---- */
function render(){
  tick++;
  const target = Math.max(0, Math.min(WORLD_W - W, player.x - W/2));
  cam += (target - cam) * 0.12;
  const c = Math.round(cam);

  // full black (also forms the letterbox bars)
  ctx.fillStyle="#05070a"; ctx.fillRect(0,0,W,H);

  // wall (blue-teal, vertical gradient)
  const wg=ctx.createLinearGradient(0,WALL_TOP,0,FLOOR_Y);
  wg.addColorStop(0,"#41566b"); wg.addColorStop(0.6,"#35485c"); wg.addColorStop(1,"#2b3a4b");
  ctx.fillStyle=wg; ctx.fillRect(0,WALL_TOP,W,FLOOR_Y-WALL_TOP);
  // ceiling trim + slats
  ctx.fillStyle="#4d6076"; ctx.fillRect(0,WALL_TOP,W,12);
  ctx.fillStyle="#303f4f"; for(let x=-(c%20); x<W; x+=20) ctx.fillRect(x,WALL_TOP+3,9,2);
  // soft wall grunge blotches (parallax-light)
  const gr=srand(99); ctx.fillStyle="rgba(20,30,40,0.10)";
  for(let i=0;i<26;i++){ const bx=((gr()*WORLD_W)-c*0.85); if(bx>-60&&bx<W) ctx.fillRect(bx, WALL_TOP+20+gr()*150, 30+gr()*60, 26+gr()*40); }

  // floor (blue-gray)
  const fg=ctx.createLinearGradient(0,FLOOR_Y,0,SCENE_BOT);
  fg.addColorStop(0,"#46566a"); fg.addColorStop(1,"#344151");
  ctx.fillStyle=fg; ctx.fillRect(0,FLOOR_Y,W,SCENE_BOT-FLOOR_Y);
  ctx.fillStyle="#26323f"; ctx.fillRect(0,FLOOR_Y,W,3);

  // lamps + their glow
  for(let lx=200; lx<WORLD_W; lx+=360) drawLamp(lx - c);
  // long metal grating walkway + a perpendicular stub near the exit
  drawGrating(360 - c, 2300);
  ctx.fillStyle="#6f6a3a"; { const vx=2760-c; if(vx>-30&&vx<W) ctx.fillRect(vx, FLOOR_Y+16-34, 16, 34); }
  // set dressing
  drawLocker(150 - c);
  drawScreen(280 - c, 11); drawScreen(560 - c, 23); drawScreen(840 - c, 37);
  drawScreen(1980 - c, 51); drawScreen(2240 - c, 67);
  drawHole(1456 - c);
  drawIntercom(2700 - c); drawExitSign(2790 - c); drawHazard(2756 - c);
  [620, 980, 2300].forEach(bx=> drawBench(bx - c));

  // proximity "press E" prompts (no orbs)
  let prompted=false;
  interactables().forEach(o=>{
    if (!prompted && canInteract(o) && state.mode==="explore"){ promptAt(o.x - c, o.y, prompt_(o)); prompted=true; }
  });

  // characters (Emy faces toward the player)
  drawChar(EMY_X - c, EMY, player.x>EMY_X?1:-1, false, curSpeaker==="emy", curSpeaker==="flash");
  const emT = emyTarget();
  if (!prompted && emT!=null && nearEmy() && state.mode==="explore") promptAt(EMY_X - c, 150, emT);
  drawChar(player.x - c, KALI, player.dir, player.walking, curSpeaker==="kali", false);

  // grain overlay across the scene band (painterly grunge)
  ctx.globalAlpha=0.5;
  for(let gx=0; gx<W; gx+=150) for(let gy=WALL_TOP; gy<SCENE_BOT; gy+=150) ctx.drawImage(grain, gx, gy);
  ctx.globalAlpha=1;

  // vignette
  const vg=ctx.createRadialGradient(W/2,(WALL_TOP+SCENE_BOT)/2,120,W/2,(WALL_TOP+SCENE_BOT)/2,560);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,0.5)");
  ctx.fillStyle=vg; ctx.fillRect(0,WALL_TOP,W,SCENE_BOT-WALL_TOP);

  // re-blacken the letterbox bars (over any glow spill)
  ctx.fillStyle="#05070a"; ctx.fillRect(0,0,W,WALL_TOP); ctx.fillRect(0,SCENE_BOT,W,BAR);

  // flash overlay
  if (flashFx>0){ flashFx-=0.012;
    ctx.fillStyle="rgba(58,106,190,"+(0.30*Math.max(0,flashFx))+")";
    ctx.fillRect(0,WALL_TOP,W,SCENE_BOT-WALL_TOP); }
}

function labelAt(x, y, text){
  ctx.font="11px Georgia, serif"; ctx.textAlign="center";
  const w=ctx.measureText(text).width+10;
  ctx.fillStyle="rgba(8,12,12,0.82)"; rr(x-w/2, y-12, w, 15, 3, "rgba(8,12,12,0.82)");
  ctx.fillStyle="#e7cd96"; ctx.fillText(text, Math.round(x), Math.round(y));
  ctx.textAlign="left";
}

/* ===========================================================================
   INTERACTABLES + PROXIMITY
   =========================================================================== */
function objById(id){ return OBJECTS.find(o=>o.id===id); }
function interactables(){
  // active = belongs to current act and (for choices) not yet decided is fine
  return OBJECTS.filter(o => (o.act||1) <= state.act && WX[o.id])
                .map(o => ({ id:o.id, obj:o, x:WX[o.id].x, y:WX[o.id].y }));
}
const RANGE = 30;
function canInteract(o){ return Math.abs(player.x - o.x) < RANGE; }
function nearEmy(){ return Math.abs(player.x - EMY_X) < RANGE+6; }

function prompt_(o){ return state.examined[o.id] ? "Look again" : "Look"; }

// What talking to Emy would do right now (returns a prompt label or null).
function emyTarget(){
  if (state.kissReady && !state.kissResolved) return "Be with her";
  if (state.handReady && !state.handsResolved) return "Sit with her";
  if (state.mode!=="explore") return null;
  return "Talk";
}

/* ===========================================================================
   INPUT
   =========================================================================== */
const keys = {};
function isLeft(){ return keys["ArrowLeft"]||keys["a"]||keys["A"]||touchDir<0; }
function isRight(){ return keys["ArrowRight"]||keys["d"]||keys["D"]||touchDir>0; }
let touchDir = 0;

document.addEventListener("keydown", (e)=>{
  keys[e.key]=true;
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  if (e.key==="ArrowUp"||e.key==="e"||e.key==="E"||e.key===" "||e.key==="Enter"){
    onAction();
  }
});
document.addEventListener("keyup",(e)=>{ keys[e.key]=false; });

// Touch controls
function bindHold(id, on, off){
  const b=el(id);
  b.addEventListener("touchstart",(e)=>{e.preventDefault();on();},{passive:false});
  b.addEventListener("touchend",(e)=>{e.preventDefault();off();},{passive:false});
  b.addEventListener("mousedown",on); b.addEventListener("mouseup",off); b.addEventListener("mouseleave",off);
}
bindHold("t-left", ()=>touchDir=-1, ()=>{ if(touchDir<0) touchDir=0; });
bindHold("t-right",()=>touchDir=1,  ()=>{ if(touchDir>0) touchDir=0; });
el("t-act").addEventListener("touchstart",(e)=>{e.preventDefault();onAction();},{passive:false});
el("t-act").addEventListener("click",(e)=>{e.preventDefault();onAction();});

// The single "action" button: advance dialogue, or interact when exploring.
function onAction(){
  if (state.mode==="dialogue"){ advanceDialogue(); return; }
  if (state.mode!=="explore") return;
  // interact with nearest object, else Emy
  let best=null, bd=RANGE;
  interactables().forEach(o=>{ const d=Math.abs(player.x-o.x); if(d<bd){bd=d;best=o;} });
  if (best){ examineObject(best.obj); return; }
  if (nearEmy() && emyTarget()){ talkToEmy(); }
}

/* ===========================================================================
   GAME LOOP
   =========================================================================== */
function loop(){
  if (state.mode==="explore"){
    let moved=false;
    if (isLeft() && !isRight()){ player.x -= 1.5; player.dir=-1; moved=true; }
    else if (isRight() && !isLeft()){ player.x += 1.5; player.dir=1; moved=true; }
    player.x = Math.max(40, Math.min(WORLD_W-40, player.x));
    player.walking = moved;
  } else {
    player.walking = false;
  }
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ===========================================================================
   DIALOGUE RUNNER (typewriter + flash + speaker lighting)
   =========================================================================== */
const dialogue=el("dialogue"), speakerEl=el("speaker"), lineEl=el("line"),
      choicesEl=el("choices"), continueEl=el("continue"), hintEl=el("hint");
const NAMES={emy:"EMY",kali:"KALI",narr:"",flash:"EMY — unspoken"};
let queue=[], onSeqEnd=null, typing=false, typeTimer=null, fullLine="";

function showDialogue(){ dialogue.classList.remove("hidden"); state.mode="dialogue"; el("touch").classList.remove("show"); }
function hideDialogue(){ dialogue.classList.add("hidden"); curSpeaker="narr"; if(!state.finished){ state.mode="explore"; el("touch").classList.add("show"); } }

function playSequence(seq, done){ queue=seq.slice(); onSeqEnd=done||null; showDialogue(); nextLine(); }
function nextLine(){
  choicesEl.innerHTML="";
  if(queue.length===0){ const cb=onSeqEnd; onSeqEnd=null; if(cb) cb(); else hideDialogue(); return; }
  renderLine(queue.shift());
}
function renderLine(item){
  speakerEl.className=item.who; speakerEl.textContent = item.who==="narr"?"❖":NAMES[item.who];
  const inner=el("dialogue-inner"); inner.classList.remove("pop"); void inner.offsetWidth; inner.classList.add("pop");
  curSpeaker=item.who;
  if(item.who==="flash") flashFx=1;
  fullLine=item.text; lineEl.innerHTML="";
  const span=document.createElement("span");
  if(item.who==="narr") span.className="narr-line";
  if(item.who==="flash") span.className="flash-line";
  lineEl.appendChild(span);
  typing=true; continueEl.classList.add("gone");
  let i=0; clearInterval(typeTimer);
  typeTimer=setInterval(()=>{ span.textContent=fullLine.slice(0,++i);
    if(i>=fullLine.length){ clearInterval(typeTimer); typing=false; continueEl.classList.remove("gone"); } },18);
}
function advanceDialogue(){
  if(typing){ clearInterval(typeTimer); typing=false; lineEl.firstChild.textContent=fullLine; continueEl.classList.remove("gone"); return; }
  if(choicesEl.children.length>0) return;
  nextLine();
}
dialogue.addEventListener("click",(e)=>{ if(e.target.classList.contains("choice")) return; advanceDialogue(); });

/* ===========================================================================
   CHOICES
   =========================================================================== */
function presentChoice(key){
  const c=CHOICES[key];
  const lead=c.lead?c.lead.slice():[c.prompt];
  playSequence(lead, ()=>{
    continueEl.classList.add("gone"); choicesEl.innerHTML="";
    c.options.forEach(opt=>{
      const b=document.createElement("button"); b.className="choice"; b.textContent=opt.label;
      b.onclick=(ev)=>{ ev.stopPropagation(); applyChoice(opt);
        playSequence(opt.after, ()=>{ hideDialogue(); afterChoiceResolved(key); }); };
      choicesEl.appendChild(b);
    });
  });
}
function applyChoice(opt){ if(opt.flag) state.flags[opt.flag]=true; state.warmth+=(opt.warmth||0); updateBond(); }
function afterChoiceResolved(key){
  if(key==="door"||key==="fire"){ state.choicesMade++; checkProgress(); }
  else if(key==="hands"){
    state.handsResolved=true;
    if(state.flags.hand_held && state.warmth>=KISS_THRESHOLD){
      state.kissReady=true;
      setHint("She's still right there. Go to her.");
    } else { setTimeout(goToEnding,700); }
  }
  else if(key==="kiss"){ state.kissResolved=true; setTimeout(goToEnding,800); }
}

/* ===========================================================================
   EXAMINE / TALK / PROGRESSION
   =========================================================================== */
function examineObject(obj){
  if(state.mode!=="explore") return;
  setHint("");
  if(obj.choice){
    if(!state.examined[obj.id]){ state.examined[obj.id]=true; playSequence(obj.lines, ()=>presentChoice(obj.choice)); }
    else playSequence([{who:"narr",text:"I've already made my peace with this one."}]);
    return;
  }
  const firstTime = !state.examined[obj.id];
  if(firstTime){ state.examined[obj.id]=true; state.warmth+=(obj.bond||0); updateBond(); }
  playSequence(obj.lines, ()=>{
    hideDialogue();
    if(firstTime && ITEMS[obj.id]) addItem(obj.id);
    checkProgress();
  });
}

function talkToEmy(){
  if(state.kissReady && !state.kissResolved){ presentChoice("kiss"); return; }
  if(state.handReady && !state.handsResolved){ presentChoice("hands"); return; }
  const seq=EMY_AMBIENT[state.ambientIdx % EMY_AMBIENT.length]; state.ambientIdx++;
  playSequence(seq);
}

function examinedForAct(a){ return OBJECTS.filter(o=>(o.act||1)===a && state.examined[o.id]).length; }
function checkProgress(){
  if(state.act===1 && state.choicesMade>=2 && examinedForAct(1)>=6){
    state.act=2;
    playSequence(ACT2_INTRO, ()=>{ hideDialogue(); setHint("New shapes down the carriage now. Go and look."); });
    return;
  }
  if(state.act===2 && !state.handReady && examinedForAct(2)>=3){
    state.handReady=true;
    setHint("The night's gone deep and quiet. Maybe it's time to just sit with her.");
  }
}

/* ===========================================================================
   HUD
   =========================================================================== */
const bondPips=Array.from(document.querySelectorAll("#bond .pip"));
function updateBond(){ const f=Math.max(0,Math.min(5,Math.round(state.warmth/2.5)));
  bondPips.forEach((p,i)=>p.classList.toggle("on",i<f)); }
let hintTimer=null;
function setHint(t){ hintEl.textContent=t; hintEl.style.opacity = t?1:0; }

/* ---- Inventory ---- */
const invEl=el("inv"), toastEl=el("toast");
function addItem(id){
  if(!ITEMS[id] || state.inventory.includes(id)) return;
  state.inventory.push(id); renderInv(true);
  toast("Kept — " + ITEMS[id].name);
}
function renderInv(animateLast){
  invEl.innerHTML="";
  state.inventory.forEach((id,i)=>{
    const it=ITEMS[id]; const s=document.createElement("div");
    s.className = "slot" + (animateLast && i===state.inventory.length-1 ? " new" : "");
    s.textContent = it.icon; s.title = it.name;
    s.onclick = ()=> showItem(id);
    invEl.appendChild(s);
  });
}
function showItem(id){
  if(state.mode!=="explore") return;     // only inspect while wandering
  const it=ITEMS[id];
  playSequence([{ who:"narr", text: it.name + " — " + it.desc }]);
}
let toastTimer=null;
function toast(msg){
  toastEl.textContent=msg; toastEl.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove("show"),2200);
}

/* ===========================================================================
   ENDINGS
   =========================================================================== */
function resolveEnding(){
  const w=state.warmth, f=state.flags;
  if(f.kissed && w>=9) return "radiant";
  if(f.kissed || f.held_close || (f.hand_held && w>=7)) return "hopeful";
  if(f.hand_none && f.fire_apart && w<=3) return "severed";
  if(f.hand_none || w<=3) return "distant";
  return "bittersweet";
}
function goToEnding(){
  state.finished=true; state.mode="ending";
  el("touch").classList.remove("show");
  faderShow(()=>{
    hideDialogueHard();
    el("hud").style.display="none"; canvas.style.opacity=0.25;
    const e=ENDINGS[resolveEnding()];
    el("ending-title").textContent=e.title;
    el("ending-body").innerHTML=e.body.split("\n\n")
      .map((p,i)=>'<span style="animation-delay:'+(0.7+i*1.1)+'s">'+p+'</span>').join("<br><br>");
    el("ending-tag").textContent=e.tag;
    const es=el("ending-screen"); es.classList.remove("gone");
    requestAnimationFrame(()=>es.classList.remove("hidden"));
    faderHide();
  });
}
function hideDialogueHard(){ dialogue.classList.add("hidden"); }
const faderEl=el("fader");
function faderShow(cb){ faderEl.classList.add("show"); setTimeout(cb,720); }
function faderHide(){ setTimeout(()=>faderEl.classList.remove("show"),60); }

/* ===========================================================================
   SOFT MUSIC (Web Audio, generated — no files)
   =========================================================================== */
let audioCtx=null, musicOn=false, musicNodes=[], musicTimer=null;
function startMusic(){
  if(musicOn) return;
  audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended") audioCtx.resume();
  musicOn=true; el("music-toggle").textContent="♪ music: on";
  const master=audioCtx.createGain(); master.gain.value=0;
  master.connect(audioCtx.destination);
  master.gain.linearRampToValueAtTime(0.16,audioCtx.currentTime+3); musicNodes.push(master);
  [55,55.4].forEach(f=>{ const o=audioCtx.createOscillator(); o.type="sine"; o.frequency.value=f;
    const g=audioCtx.createGain(); g.gain.value=0.5; o.connect(g); g.connect(master); o.start(); musicNodes.push(o,g); });
  const scale=[220,261.63,293.66,329.63,392.0,440.0];
  const playNote=()=>{ if(!musicOn) return;
    if(Math.random()>0.28){ const f=scale[Math.floor(Math.random()*scale.length)];
      const o=audioCtx.createOscillator(); o.type="triangle"; o.frequency.value=f;
      const g=audioCtx.createGain(); const t=audioCtx.currentTime;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.12,t+0.08);
      g.gain.exponentialRampToValueAtTime(0.0001,t+2.4); o.connect(g); g.connect(master); o.start(t); o.stop(t+2.5); }
    musicTimer=setTimeout(playNote,1400+Math.random()*1400); };
  playNote();
}
function stopMusic(){ musicOn=false; el("music-toggle").textContent="♪ music: off"; clearTimeout(musicTimer);
  musicNodes.forEach(n=>{try{n.stop?n.stop():(n.gain.value=0);}catch(e){}}); musicNodes=[]; }
el("music-toggle").onclick=()=>(musicOn?stopMusic():startMusic());

/* ===========================================================================
   FLOW
   =========================================================================== */
function startGame(){
  const t=el("title-screen"); t.classList.add("hidden"); setTimeout(()=>t.classList.add("gone"),800);
  updateBond(); renderInv(); startMusic();
  setTimeout(()=>{ playSequence(OPENING, ()=>{ hideDialogue();
    setHint("Walk with ← →   ·   press E to interact"); }); }, 700);
}
function resetGame(){
  Object.assign(state,{mode:"explore",warmth:0,flags:{},examined:{},inventory:[],choicesMade:0,act:1,
    handReady:false,handsResolved:false,kissReady:false,kissResolved:false,finished:false,ambientIdx:0});
  player.x=180; player.dir=1; cam=0;
  el("hud").style.display=""; canvas.style.opacity=1; renderInv();
  const es=el("ending-screen"); es.classList.add("hidden"); setTimeout(()=>es.classList.add("gone"),600);
  setTimeout(()=>{ playSequence(OPENING, ()=>{ hideDialogue();
    setHint("Walk with ← →   ·   press E to interact"); }); }, 700);
}
el("start-btn").onclick=()=>{ startGame(); };
el("replay-btn").onclick=()=>faderShow(()=>{ resetGame(); faderHide(); });
</script>
</body>
